syntax = "proto3";

option go_package = "https://github.com/zoninnik89/messenger/common/api";

package api;

// SSO

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
}

message RegisterRequest {
  string login = 1; // Email of a user to be registered.
  string password = 2; // Password of a user to be registered.
}

message RegisterResponse {
  string user_id = 1; // User ID of the registered user.
}

message LoginRequest {
  string login = 1; // Email of a user to be logged in.
  string password = 2; // Password of a user to be logged in.
  int32 app_id = 3; // ID of the app to be logged in.
}

message LoginResponse {
  string token = 1; // Auth token of the logged in user.
}

// Pub-Sub

service PubSubService {
  // Client subscribes to a chat and receives messages via streaming.
  rpc Subscribe(SubscribeRequest) returns (stream Message);
}

message Message {
  string chat_id = 1;
  string sender_id = 2;
  string message_id = 3;
  string message_text = 4;
  string sent_ts = 5;
}

message SubscribeRequest {
  string user_id = 1;
}

// Chat client

service ChatClientService{
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc GetMessagesStream(GetMessagesStreamRequest) returns (stream Message);
}

message SendMessageRequest {
  Message message = 1;
}

message SendMessageResponse {
  string status = 1;
}

message GetMessagesStreamRequest {
  string user_id = 1;
}

// Chat History

service ChatHistoryService {
  rpc CreateChat(CreateChatRequest) returns (CreateChatResponse);
  rpc GetChatMessages(GetChatMessagesRequest) returns (GetChatMessagesResponse);
  rpc GetChatsListByParticipantID(GetChatsListByParticipantIDRequest) returns (GetChatsListByParticipantIDResponse);
}

message Participant {
  string id = 1;
}

message CreateChatRequest {
  string creator_id = 1;
  repeated Participant participants = 2;
}

message CreateChatResponse {
  string id = 1;
}

message GetChatMessagesRequest {
  string chat_id = 1;
  string from_ts = 2;
  string to_ts = 3;
}

message GetChatMessagesResponse {
  repeated Message messages = 1;
}

message Chat {
  string ID = 1;
}

message GetChatsListByParticipantIDRequest {
  string chat_id = 1;
}

message GetChatsListByParticipantIDResponse {
  repeated Chat chats = 1;
}

